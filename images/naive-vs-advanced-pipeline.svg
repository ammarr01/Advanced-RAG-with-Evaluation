<svg width="100%" viewBox="0 0 680 444" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Naive vs advanced pipeline design decisions</title>
<desc>Two parallel four-stage pipelines. Naive: format-agnostic extraction, fixed-size chunking, single-shot retrieval, no reranking. Advanced: structure-aware extraction, semantic chunking plus RAPTOR, multi-query and decomposition retrieval, cross-encoder reranking.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect width="680" height="444" fill="#FFFFFF"/>

<text x="180" y="64" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#2C2C2A">Naive pipeline</text>
<text x="500" y="64" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#2C2C2A">Advanced pipeline</text>

<g>
<rect x="50" y="90" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="180" y="108" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#444441">Extraction</text>
<text x="180" y="128" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">Format-agnostic, no tables</text>
</g>
<g>
<rect x="50" y="176" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="180" y="194" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#444441">Chunking</text>
<text x="180" y="214" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">Fixed size, 1000/200</text>
</g>
<g>
<rect x="50" y="262" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="180" y="280" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#444441">Retrieval</text>
<text x="180" y="300" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">Single-shot, top-k = 4</text>
</g>
<g>
<rect x="50" y="348" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="180" y="366" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#444441">Generation</text>
<text x="180" y="386" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">No reranking</text>
</g>

<line x1="180" y1="146" x2="180" y2="176" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="180" y1="232" x2="180" y2="262" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="180" y1="318" x2="180" y2="348" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="370" y="90" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="500" y="108" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#085041">Extraction</text>
<text x="500" y="128" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0F6E56">Structure-aware parsing</text>
</g>
<g>
<rect x="370" y="176" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="500" y="194" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#085041">Chunking</text>
<text x="500" y="214" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0F6E56">Semantic + RAPTOR</text>
</g>
<g>
<rect x="370" y="262" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="500" y="280" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#085041">Retrieval</text>
<text x="500" y="300" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0F6E56">Multi-query + decomposition</text>
</g>
<g>
<rect x="370" y="348" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="500" y="366" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#085041">Generation</text>
<text x="500" y="386" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0F6E56">Cross-encoder reranking</text>
</g>

<line x1="500" y1="146" x2="500" y2="176" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow-teal)"/>
<line x1="500" y1="232" x2="500" y2="262" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow-teal)"/>
<line x1="500" y1="318" x2="500" y2="348" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow-teal)"/>
</svg>
